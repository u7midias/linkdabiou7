<style>
  :root{
    --green-900:#0a1f0f; --green-800:#0f2d17; --green-700:#143d1f;
    --brand:#1a7a3a; --accent:#3ddc6e; --white:#ffffff; --soft:#c9d6cd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(26,122,58,.35) 0%, rgba(10,31,15,0) 60%),
      var(--green-900);
    color:var(--white);
    display:flex;justify-content:center;
    padding:56px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
  .logo{
    width:96px;height:96px;border-radius:24px;overflow:hidden;
    background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .logo img{width:100%;height:100%;display:block;object-fit:cover}
  h1{font-size:22px;font-weight:700;margin-top:18px;letter-spacing:-.2px}
  .handle{font-size:14px;color:var(--accent);font-weight:500;margin-top:2px}
  .tagline{font-size:15px;color:var(--soft);text-align:center;line-height:1.5;margin-top:14px;max-width:320px}
  nav{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:34px}
  .link{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border-radius:14px;
    background:var(--green-800);border:1px solid var(--green-700);
    color:var(--white);text-decoration:none;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .link:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--green-700)}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .link .ico{
    flex:none;width:42px;height:42px;border-radius:10px;
    display:grid;place-items:center;background:rgba(61,220,110,.12);color:var(--accent);
  }
  .link .ico svg{width:22px;height:22px}
  .link .txt{flex:1;min-width:0}
  .link strong{display:block;font-size:16px;font-weight:600}
  .link span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
  .link .arrow{flex:none;color:var(--soft);width:18px;height:18px}
  .link.primary{background:var(--accent);border-color:var(--accent);color:var(--green-900)}
  .link.primary span{color:var(--green-800)}
  .link.primary .ico{background:rgba(10,31,15,.12);color:var(--green-900)}
  .link.primary .arrow{color:var(--green-900)}
  .link.primary:hover{background:#5ae585;border-color:#5ae585}
  footer{margin-top:44px;font-size:12px;color:#7f9486;text-align:center}
  footer a{color:#7f9486}
  @media (prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
</style>
</head>
